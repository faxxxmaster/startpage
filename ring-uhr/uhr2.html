<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeitringe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E1A;
    --bg-2: #0D1224;
    --text-primary: #ECEFF4;
    --text-secondary: #7C87A3;
    --track: rgba(255,255,255,0.07);

    --c-sek: #4FD8C4;
    --c-min: #4EA8F0;
    --c-std: #9B7FF0;
    --c-tag: #E86FC0;
    --c-jahr: #F2C94C;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    background:
      radial-gradient(ellipse at 50% 40%, var(--bg-2), var(--bg) 65%);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
    overflow-x: hidden;
  }

  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
    max-width: 700px;
  }

  .dial-wrap{
    position: relative;
    width: min(92vw, 620px);
    aspect-ratio: 1 / 1;
  }

  svg{
    width: 100%;
    height: 100%;
    display: block;
    transform: rotate(-90deg);
  }

  .ring-track{
    fill: none;
    stroke: var(--track);
    stroke-width: 15;
  }

  .ring-progress{
    fill: none;
    stroke-width: 15;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.9s linear;
  }

  .center{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
    pointer-events: none;
  }

  .center-inner{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 58%;
  }

  .clock{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: clamp(16px, 3.6vw, 24px);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .date{
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(9px, 1.7vw, 11px);
    color: var(--text-secondary);
  }

  .counters{
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .counter-form{
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .counter-input{
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--track);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 6px 2px;
    outline: none;
  }

  .counter-input[type="text"]{
    flex: 1;
    min-width: 0;
  }

  .counter-input[type="datetime-local"]{
    color-scheme: dark;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
  }

  .counter-input:focus{
    border-bottom-color: var(--text-primary);
  }

  .counter-add{
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--track);
    background: transparent;
    color: var(--text-primary);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }

  .counter-add:hover{
    border-color: var(--text-primary);
  }

  .counter-toggle{
    align-self: flex-start;
    background: none;
    border: 1px solid var(--track);
    color: var(--text-secondary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 14px;
    cursor: pointer;
  }

  .counter-toggle:hover{
    color: var(--text-primary);
    border-color: var(--text-primary);
  }

  .counter-cancel{
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }

  .counter-cancel:hover{
    color: var(--text-primary);
  }

  .counter-save{
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--track);
    background: transparent;
    color: var(--text-primary);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }

  .counter-save:hover{
    border-color: var(--text-primary);
  }

  .counter-input:focus-visible,
  .counter-add:focus-visible,
  .counter-save:focus-visible,
  .counter-cancel:focus-visible,
  .counter-toggle:focus-visible,
  .counter-remove:focus-visible,
  .counter-item:focus-visible{
    outline: 2px solid var(--text-primary);
    outline-offset: 2px;
  }

  .counter-list{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .counter-item{
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
  }

  .counter-item:last-child{
    border-bottom: none;
    padding-bottom: 0;
  }

  .counter-item-edit{
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .counter-item-edit:last-child{
    border-bottom: none;
    padding-bottom: 0;
  }

  .counter-item-edit .counter-input[type="text"]{
    font-size: 13px;
  }

  .counter-edit-actions{
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .counter-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .counter-title{
    font-size: 13px;
  }

  .counter-remove{
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }

  .counter-remove:hover{
    color: var(--text-primary);
  }

  .counter-remaining{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .counter-bar-track{
    height: 5px;
    border-radius: 3px;
    background: var(--track);
    overflow: hidden;
  }

  .counter-bar-fill{
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  .legend{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }

  .legend-item{
    display: flex;
    align-items: baseline;
    gap: 7px;
    color: var(--text-secondary);
  }

  .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    transform: translateY(-1px);
  }

  .legend-label{
    color: var(--text-secondary);
  }

  .legend-value{
    color: var(--text-primary);
  }

  @media (prefers-reduced-motion: reduce){
    .ring-progress{ transition: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="dial-wrap">
    <svg viewBox="0 0 640 640">
      <circle class="ring-track" cx="320" cy="320" r="110"></circle>
      <circle class="ring-track" cx="320" cy="320" r="152"></circle>
      <circle class="ring-track" cx="320" cy="320" r="194"></circle>
      <circle class="ring-track" cx="320" cy="320" r="236"></circle>
      <circle class="ring-track" cx="320" cy="320" r="278"></circle>

      <circle id="r-sek"   class="ring-progress" cx="320" cy="320" r="110" stroke="var(--c-sek)"></circle>
      <circle id="r-min"   class="ring-progress" cx="320" cy="320" r="152" stroke="var(--c-min)"></circle>
      <circle id="r-std"   class="ring-progress" cx="320" cy="320" r="194" stroke="var(--c-std)"></circle>
      <circle id="r-tag"   class="ring-progress" cx="320" cy="320" r="236" stroke="var(--c-tag)"></circle>
      <circle id="r-jahr"  class="ring-progress" cx="320" cy="320" r="278" stroke="var(--c-jahr)"></circle>
    </svg>

    <div class="center">
      <div class="center-inner">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">–</div>
      </div>
    </div>
  </div>

  <div class="counters">
    <div class="counter-list" data-list></div>
    <div class="counter-toggle-area" data-toggle-area></div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:var(--c-sek)"></span><span class="legend-label">sek</span>&nbsp;<span class="legend-value" id="v-sek">–</span></div>
    <div class="legend-item"><span class="dot" style="background:var(--c-min)"></span><span class="legend-label">min</span>&nbsp;<span class="legend-value" id="v-min">–</span></div>
    <div class="legend-item"><span class="dot" style="background:var(--c-std)"></span><span class="legend-label">std</span>&nbsp;<span class="legend-value" id="v-std">–</span></div>
    <div class="legend-item"><span class="dot" style="background:var(--c-tag)"></span><span class="legend-label">tag</span>&nbsp;<span class="legend-value" id="v-tag">–</span></div>
    <div class="legend-item"><span class="dot" style="background:var(--c-jahr)"></span><span class="legend-label">jahr</span>&nbsp;<span class="legend-value" id="v-jahr">–</span></div>
  </div>
</div>

<script>
  const RADII = {
    sek: 110, min: 152, std: 194, tag: 236, jahr: 278
  };
  const CIRC = {};
  for(const k in RADII){ CIRC[k] = 2 * Math.PI * RADII[k]; }

  for(const k in CIRC){
    document.getElementById('r-' + k).style.strokeDasharray = CIRC[k];
  }

  function pad(n){ return n.toString().padStart(2, '0'); }

  function daysInMonth(year, monthIndex){
    return new Date(year, monthIndex + 1, 0).getDate();
  }

  function dayOfYearFraction(now){
    const start = new Date(now.getFullYear(), 0, 1);
    const end = new Date(now.getFullYear() + 1, 0, 1);
    return (now - start) / (end - start);
  }

  function setRing(key, fraction){
    const c = CIRC[key];
    const offset = c * (1 - fraction);
    document.getElementById('r-' + key).style.strokeDashoffset = offset;
  }

  const COUNTER_STORAGE_KEY = 'time-rings:counters';
  const COUNTER_COLORS = ['var(--c-sek)', 'var(--c-min)', 'var(--c-std)', 'var(--c-tag)', 'var(--c-jahr)'];

  let counters = [];
  try{
    counters = JSON.parse(localStorage.getItem(COUNTER_STORAGE_KEY) || '[]');
  } catch(e){
    counters = [];
  }

  let formOpen = false;
  let editingId = null;

  function persistCounters(){
    localStorage.setItem(COUNTER_STORAGE_KEY, JSON.stringify(counters));
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(ch){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function toLocalInputValue(date){
    const p = function(n){ return n.toString().padStart(2, '0'); };
    return date.getFullYear() + '-' + p(date.getMonth() + 1) + '-' + p(date.getDate()) + 'T' + p(date.getHours()) + ':' + p(date.getMinutes());
  }

  function diffBreakdown(now, target){
    let months = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
    let anchor = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
    if(anchor > target){
      months -= 1;
      anchor = new Date(now.getFullYear(), now.getMonth() + months, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
    }
    let remainMs = Math.max(0, target - anchor);
    const days = Math.floor(remainMs / 86400000);
    remainMs -= days * 86400000;
    const hours = Math.floor(remainMs / 3600000);
    return { months: Math.max(0, months), days, hours };
  }

  function formatRemaining(now, target){
    if(target <= now) return 'erreicht';
    const { months, days, hours } = diffBreakdown(now, target);
    const parts = [];
    if(months > 0) parts.push(months + ' Monat' + (months === 1 ? '' : 'e'));
    if(months > 0 || days > 0) parts.push(days + ' Tag' + (days === 1 ? '' : 'e'));
    parts.push(hours + ' Std');
    return parts.join(', ');
  }

  function counterProgress(now, c){
    const target = new Date(c.target);
    const created = new Date(c.created);
    if(target <= created) return 100;
    return Math.min(100, Math.max(0, ((now - created) / (target - created)) * 100));
  }

  function itemTemplate(c, i, now){
    const target = new Date(c.target);
    const pct = counterProgress(now, c);
    const color = COUNTER_COLORS[i % COUNTER_COLORS.length];
    return '<div class="counter-item" data-id="' + c.id + '" data-action="edit" tabindex="0">' +
      '<div class="counter-head">' +
        '<span class="counter-title">' + escapeHtml(c.title) + '</span>' +
        '<button type="button" class="counter-remove" data-action="delete" data-id="' + c.id + '" aria-label="Entfernen">×</button>' +
      '</div>' +
      '<div class="counter-remaining">' + formatRemaining(now, target) + '</div>' +
      '<div class="counter-bar-track"><div class="counter-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
    '</div>';
  }

  function editTemplate(c){
    const target = new Date(c.target);
    return '<form class="counter-item-edit" data-edit-form data-id="' + c.id + '">' +
      '<div class="counter-head">' +
        '<input type="text" class="counter-input" data-field="title" value="' + escapeHtml(c.title) + '" maxlength="28" required>' +
        '<button type="button" class="counter-remove" data-action="delete" data-id="' + c.id + '" aria-label="Entfernen">×</button>' +
      '</div>' +
      '<input type="datetime-local" class="counter-input" data-field="target" value="' + toLocalInputValue(target) + '" required>' +
      '<div class="counter-edit-actions">' +
        '<button type="button" class="counter-cancel" data-action="cancel-edit" aria-label="Abbrechen">×</button>' +
        '<button type="submit" class="counter-save" aria-label="Speichern">✓</button>' +
      '</div>' +
    '</form>';
  }

  function renderList(){
    const list = document.querySelector('[data-list]');
    const now = new Date();
    list.innerHTML = counters.map(function(c, i){
      return c.id === editingId ? editTemplate(c) : itemTemplate(c, i, now);
    }).join('');
  }

  function renderToggleArea(){
    const area = document.querySelector('[data-toggle-area]');
    if(formOpen){
      area.innerHTML =
        '<form class="counter-form" data-form>' +
          '<input type="text" class="counter-input" data-field="title" placeholder="Titel" maxlength="28" required>' +
          '<input type="datetime-local" class="counter-input" data-field="target" required>' +
          '<button type="submit" class="counter-add" aria-label="Hinzufügen">+</button>' +
          '<button type="button" class="counter-cancel" data-action="cancel-form" aria-label="Abbrechen">×</button>' +
        '</form>';
      const titleInput = area.querySelector('[data-field="title"]');
      if(titleInput) titleInput.focus();
    } else {
      area.innerHTML = '<button type="button" class="counter-toggle" data-action="open-form">+ Counter</button>';
    }
  }

  function updateLiveCounterValues(){
    const now = new Date();
    counters.forEach(function(c){
      if(c.id === editingId) return;
      const el = document.querySelector('.counter-item[data-id="' + c.id + '"]');
      if(!el) return;
      el.querySelector('.counter-remaining').textContent = formatRemaining(now, new Date(c.target));
      el.querySelector('.counter-bar-fill').style.width = counterProgress(now, c) + '%';
    });
  }

  const countersEl = document.querySelector('.counters');

  countersEl.addEventListener('click', function(e){
    const actionEl = e.target.closest('[data-action]');
    if(!actionEl) return;
    const action = actionEl.dataset.action;

    if(action === 'open-form'){
      formOpen = true;
      renderToggleArea();
    } else if(action === 'cancel-form'){
      formOpen = false;
      renderToggleArea();
    } else if(action === 'delete'){
      const id = actionEl.dataset.id;
      counters = counters.filter(function(c){ return c.id !== id; });
      if(editingId === id) editingId = null;
      persistCounters();
      renderList();
    } else if(action === 'cancel-edit'){
      editingId = null;
      renderList();
    } else if(action === 'edit'){
      editingId = actionEl.dataset.id;
      renderList();
      const titleInput = document.querySelector('.counter-item-edit [data-field="title"]');
      if(titleInput) titleInput.focus();
    }
  });

  countersEl.addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const actionEl = e.target.closest('[data-action="edit"]');
    if(!actionEl) return;
    e.preventDefault();
    editingId = actionEl.dataset.id;
    renderList();
    const titleInput = document.querySelector('.counter-item-edit [data-field="title"]');
    if(titleInput) titleInput.focus();
  });

  countersEl.addEventListener('submit', function(e){
    e.preventDefault();
    if(e.target.matches('[data-form]')){
      const title = e.target.querySelector('[data-field="title"]').value.trim();
      const targetVal = e.target.querySelector('[data-field="target"]').value;
      if(!title || !targetVal) return;
      counters.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: title,
        target: new Date(targetVal).toISOString(),
        created: new Date().toISOString()
      });
      formOpen = false;
      persistCounters();
      renderList();
      renderToggleArea();
    } else if(e.target.matches('[data-edit-form]')){
      const id = e.target.dataset.id;
      const title = e.target.querySelector('[data-field="title"]').value.trim();
      const targetVal = e.target.querySelector('[data-field="target"]').value;
      if(!title || !targetVal) return;
      const c = counters.find(function(cc){ return cc.id === id; });
      if(c){
        c.title = title;
        c.target = new Date(targetVal).toISOString();
      }
      editingId = null;
      persistCounters();
      renderList();
    }
  });

  renderList();
  renderToggleArea();

  function tick(){
    const now = new Date();

    const secFrac  = (now.getSeconds()) / 60;
    const minFrac  = (now.getMinutes() * 60 + now.getSeconds()) / 3600;
    const hourFrac = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400;
    const dim      = daysInMonth(now.getFullYear(), now.getMonth());
    const dayFrac  = ((now.getDate() - 1) + hourFrac) / dim;
    const yearFrac = dayOfYearFraction(now);

    setRing('sek', secFrac);
    setRing('min', minFrac);
    setRing('std', hourFrac);
    setRing('tag', dayFrac);
    setRing('jahr', yearFrac);

    document.getElementById('clock').textContent =
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());

    document.getElementById('date').textContent =
      now.toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

    document.getElementById('v-sek').textContent   = now.getSeconds() + '/60';
    document.getElementById('v-min').textContent   = now.getMinutes() + '/60';
    document.getElementById('v-std').textContent   = now.getHours() + '/24';
    document.getElementById('v-tag').textContent   = now.getDate() + '/' + dim;
    document.getElementById('v-jahr').textContent  = Math.round(yearFrac * 100) + '%';

    updateLiveCounterValues();
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
