<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeitringe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E1A;
    --bg-2: #0D1224;
    --text-primary: #ECEFF4;
    --text-secondary: #7C87A3;
    --track: rgba(255,255,255,0.07);

    --c-sek: #4FD8C4;
    --c-min: #4EA8F0;
    --c-std: #9B7FF0;
    --c-tag: #E86FC0;
    --c-jahr: #F2C94C;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    background:
      radial-gradient(ellipse at 50% 40%, var(--bg-2), var(--bg) 65%);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px 96px;
    overflow-x: hidden;
  }

  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    width: 100%;
    max-width: 1200px;
  }

  .dial-row{
    width: 100%;
    display: grid;
    grid-template-columns: 1fr min(92vw, 620px) 1fr;
    align-items: center;
  }

  .dial-row .dial-wrap{ grid-column: 2; }

  .dial-row .legend{
    grid-column: 3;
    justify-self: start;
    padding-left: 28px;
  }

  @media (max-width: 1000px){
    .dial-row{
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 24px;
    }
    .dial-row .dial-wrap{ grid-column: 1; }
    .dial-row .legend{
      grid-column: 1;
      justify-self: center;
      padding-left: 0;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 18px;
    }
  }

  .dial-wrap{
    position: relative;
    width: min(92vw, 620px);
    aspect-ratio: 1 / 1;
  }

  svg{
    width: 100%;
    height: 100%;
    display: block;
    transform: rotate(-90deg);
  }

  .ring-track{
    fill: none;
    stroke: var(--track);
    stroke-width: 15;
  }

  .ring-progress{
    fill: none;
    stroke-width: 15;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.9s linear;
  }

  .center{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 4px;
    pointer-events: none;
  }

  .center-inner{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 58%;
  }

  .clock{
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: clamp(16px, 3.6vw, 24px);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .date{
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 400;
    font-size: clamp(9px, 1.7vw, 11px);
    color: var(--text-secondary);
  }

  .counters{
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .counter-form{
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
    border: 1px solid var(--track);
    border-radius: 14px;
    background: rgba(255,255,255,0.02);
  }

  .counter-form-row{
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }

  .counter-field{
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 140px;
  }

  .counter-field > span{
    font-size: 12px;
    color: var(--text-secondary);
  }

  .btn-ok{
    background: var(--text-primary);
    color: var(--bg);
    border: 1px solid var(--text-primary);
    border-radius: 16px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 500;
    font-size: 15px;
    padding: 8px 26px;
    cursor: pointer;
  }

  .btn-ok:hover{ opacity: 0.85; }

  .btn-text{
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    padding: 8px 12px;
    cursor: pointer;
  }

  .btn-text:hover{ color: var(--text-primary); }

  .counter-input{
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--track);
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    padding: 6px 2px;
    outline: none;
  }

  .counter-input[type="text"]{
    flex: 1;
    min-width: 0;
  }

  .counter-input[type="date"],
  .counter-input[type="time"]{
    color-scheme: dark;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
  }

  .counter-input:focus{
    border-bottom-color: var(--text-primary);
  }

  .counter-input[type="date"]::-webkit-calendar-picker-indicator,
  .counter-input[type="time"]::-webkit-calendar-picker-indicator{
    opacity: 1;
    width: 22px;
    height: 22px;
    padding: 5px;
    margin-left: 8px;
    border-radius: 8px;
    background-color: rgba(255,255,255,0.10);
    filter: brightness(1.4);
    cursor: pointer;
    transition: background-color 0.2s;
  }

  .counter-input[type="date"]::-webkit-calendar-picker-indicator:hover,
  .counter-input[type="time"]::-webkit-calendar-picker-indicator:hover{
    background-color: rgba(255,255,255,0.22);
  }

  .counter-add{
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--track);
    background: transparent;
    color: var(--text-primary);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
  }

  .counter-add:hover{
    border-color: var(--text-primary);
  }

  .counter-toggle{
    align-self: flex-start;
    background: none;
    border: 1px solid var(--track);
    color: var(--text-secondary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    padding: 8px 16px;
    border-radius: 14px;
    cursor: pointer;
  }

  .counter-toggle:hover{
    color: var(--text-primary);
    border-color: var(--text-primary);
  }

  .counter-cancel{
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }

  .counter-cancel:hover{
    color: var(--text-primary);
  }

  .counter-save{
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--track);
    background: transparent;
    color: var(--text-primary);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
  }

  .counter-save:hover{
    border-color: var(--text-primary);
  }

  .counter-input:focus-visible,
  .counter-add:focus-visible,
  .counter-save:focus-visible,
  .counter-cancel:focus-visible,
  .counter-toggle:focus-visible,
  .btn-ok:focus-visible,
  .btn-danger:focus-visible,
  .btn-text-sm:focus-visible,
  .btn-text:focus-visible,
  .counter-remove:focus-visible,
  .counter-item:focus-visible{
    outline: 2px solid var(--text-primary);
    outline-offset: 2px;
  }

  .counter-list{
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .counter-item{
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
  }

  .counter-item:last-child{
    border-bottom: none;
    padding-bottom: 0;
  }

  .counter-item-edit{
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .counter-item-edit:last-child{
    border-bottom: none;
    padding-bottom: 0;
  }

  .counter-item-edit .counter-input[type="text"]{
    font-size: 16px;
  }

  .counter-edit-actions{
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
  }

  .counter-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .counter-title{
    font-size: 18px;
  }

  .counter-hint{
    font-size: 13px;
    line-height: 1.5;
    color: var(--c-jahr);
  }

  .counter-hint[hidden]{ display: none; }

  .counter-note{
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  .counter-repeat{
    margin-left: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  select.counter-input{
    color-scheme: dark;
    font-size: 15px;
    cursor: pointer;
  }

  select.counter-input option{
    background: var(--bg-2);
    color: var(--text-primary);
  }

  .counter-remove{
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    padding: 0 2px;
    line-height: 1;
  }

  .counter-remove:hover{
    color: var(--text-primary);
  }

  .counter-confirm{
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .counter-confirm-text{
    font-size: 14px;
    color: var(--text-secondary);
  }

  .btn-danger{
    background: transparent;
    border: 1px solid #E86F6F;
    color: #E86F6F;
    border-radius: 14px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 4px 14px;
    cursor: pointer;
  }

  .btn-danger:hover{
    background: #E86F6F;
    color: var(--bg);
  }

  .btn-text-sm{
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 4px 8px;
    cursor: pointer;
  }

  .btn-text-sm:hover{ color: var(--text-primary); }

  .counter-remaining{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    color: var(--text-secondary);
  }

  .counter-bar-track{
    position: relative;
    height: 8px;
    border-radius: 4px;
    background: var(--track);
  }

  /* Lichtstreifen, der dauerhaft über die ganze Leiste läuft */
  .counter-bar-track::after{
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.35) 50%, transparent 100%);
    background-size: 35% 100%;
    background-repeat: no-repeat;
    animation: bar-sweep 2.4s linear infinite;
  }

  .counter-bar-fill{
    position: relative;
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }

  /* leuchtender, pulsierender Punkt an der Spitze */
  .counter-bar-fill::after{
    content: "";
    position: absolute;
    top: 50%;
    right: -6px;
    width: 12px;
    height: 12px;
    margin-top: -6px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px 2px currentColor;
    animation: bar-dot 1.2s ease-in-out infinite;
  }

  .counter-bar-fill.done::after{
    display: none;
  }

  @keyframes bar-sweep{
    0%   { background-position: -50% 0; }
    100% { background-position: 150% 0; }
  }

  @keyframes bar-dot-soft{
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  @keyframes bar-dot{
    0%, 100% { transform: scale(0.8); opacity: 0.6; }
    50%      { transform: scale(1.25); opacity: 1; }
  }

  .legend{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }

  .legend-item{
    display: flex;
    align-items: baseline;
    gap: 7px;
    color: var(--text-secondary);
  }

  .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    transform: translateY(-1px);
  }

  .legend-label{
    color: var(--text-secondary);
  }

  .legend-value{
    color: var(--text-primary);
  }

  .home-link{
    display: inline-block;
    margin-top: 48px;
    padding: 10px 24px;
    border: 1px solid var(--track);
    border-radius: 18px;
    color: var(--text-secondary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 15px;
    text-decoration: none;
    transition: color 0.2s, border-color 0.2s;
  }

  .home-link:hover{
    color: var(--text-primary);
    border-color: var(--text-primary);
  }

  .home-link:focus-visible{
    outline: 2px solid var(--text-primary);
    outline-offset: 2px;
  }


  /* ---------- Einstellungen (Zahnrad, Export/Import) ---------- */
  .settings{
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100vw - 32px);
  }

  .gear-btn{
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.14);
    background: var(--bg-2);
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, transform 0.3s;
  }

  .gear-btn:hover,
  .gear-btn[aria-expanded="true"]{
    color: var(--text-primary);
    border-color: var(--text-primary);
  }

  .gear-btn[aria-expanded="true"]{ transform: rotate(45deg); }

  .gear-icon{
    width: 22px;
    height: 22px;
    transform: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .backup-pill{
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 8px 14px;
    border-radius: 18px;
    border: 1px solid rgba(242,201,76,0.5);
    background: rgba(242,201,76,0.08);
    color: var(--c-jahr);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
  }

  .backup-pill[hidden]{ display: none; }

  .backup-pill:hover{ background: rgba(242,201,76,0.16); }

  .backup-pill-dot{
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--c-jahr);
  }

  .backup-pill-text{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .settings-panel{
    position: absolute;
    right: 0;
    bottom: 56px;
    width: 300px;
    max-width: calc(100vw - 32px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.14);
    background: var(--bg-2);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }

  .settings-panel[hidden]{ display: none; }

  .settings-title{
    font-size: 15px;
    font-weight: 500;
  }

  .settings-status{
    font-size: 13px;
    color: var(--text-secondary);
  }

  .settings-actions{
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .settings-btn{
    flex: 1;
    min-width: 110px;
    padding: 9px 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.18);
    background: transparent;
    color: var(--text-primary);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
  }

  .settings-btn:hover{ border-color: var(--text-primary); }

  .import-choice{
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 13px;
  }

  .import-choice[hidden]{ display: none; }

  .settings-msg{
    min-height: 1em;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .settings-msg.error{ color: #E86F6F; }

  .gear-btn:focus-visible,
  .backup-pill:focus-visible,
  .settings-btn:focus-visible{
    outline: 2px solid var(--text-primary);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .gear-btn{ transition: none; }
    .gear-btn[aria-expanded="true"]{ transform: none; }
  }

  @media (prefers-reduced-motion: reduce){
    .ring-progress{ transition: none; }
    .counter-bar-track::after{ animation: none; opacity: 0; }
    .counter-bar-fill::after{ animation-name: bar-dot-soft; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="dial-row">
  <div class="dial-wrap">
    <svg viewBox="0 0 640 640">
      <circle class="ring-track" cx="320" cy="320" r="110"></circle>
      <circle class="ring-track" cx="320" cy="320" r="152"></circle>
      <circle class="ring-track" cx="320" cy="320" r="194"></circle>
      <circle class="ring-track" cx="320" cy="320" r="236"></circle>
      <circle class="ring-track" cx="320" cy="320" r="278"></circle>

      <circle id="r-sek"   class="ring-progress" cx="320" cy="320" r="110" stroke="var(--c-sek)"></circle>
      <circle id="r-min"   class="ring-progress" cx="320" cy="320" r="152" stroke="var(--c-min)"></circle>
      <circle id="r-std"   class="ring-progress" cx="320" cy="320" r="194" stroke="var(--c-std)"></circle>
      <circle id="r-tag"   class="ring-progress" cx="320" cy="320" r="236" stroke="var(--c-tag)"></circle>
      <circle id="r-jahr"  class="ring-progress" cx="320" cy="320" r="278" stroke="var(--c-jahr)"></circle>
    </svg>

    <div class="center">
      <div class="center-inner">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date" id="date">–</div>
      </div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot" style="background:var(--c-sek)"></span><span class="legend-label">sek</span>&nbsp;<span class="legend-value" id="v-sek">–</span></div>
    <div class="legend-item"><span class="dot" style="background:var(--c-min)"></span><span class="legend-label">min</span>&nbsp;<span class="legend-value" id="v-min">–</span></div>
    <div class="legend-item"><span class="dot" style="background:var(--c-std)"></span><span class="legend-label">std</span>&nbsp;<span class="legend-value" id="v-std">–</span></div>
    <div class="legend-item"><span class="dot" style="background:var(--c-tag)"></span><span class="legend-label">tag</span>&nbsp;<span class="legend-value" id="v-tag">–</span></div>
    <div class="legend-item"><span class="dot" style="background:var(--c-jahr)"></span><span class="legend-label">jahr</span>&nbsp;<span class="legend-value" id="v-jahr">–</span></div>
  </div>
  </div>

  <div class="counters">
    <div class="counter-list" data-list></div>
    <div class="counter-toggle-area" data-toggle-area></div>
  </div>

  <a class="home-link" href="index.html">Startseite</a>

</div>

<div class="settings" id="settings">
  <div class="settings-panel" id="settings-panel" hidden>
    <div class="settings-title">Daten sichern</div>
    <div class="settings-status" id="backup-status">–</div>
    <div class="settings-actions">
      <button type="button" class="settings-btn" id="btn-export">Exportieren</button>
      <button type="button" class="settings-btn" id="btn-import">Importieren</button>
    </div>
    <input type="file" id="import-file" accept=".json,application/json" hidden>
    <div class="import-choice" id="import-choice" hidden>
      <div id="import-choice-text"></div>
      <div class="settings-actions">
        <button type="button" class="settings-btn" id="btn-import-replace">Ersetzen</button>
        <button type="button" class="settings-btn" id="btn-import-merge">Ergänzen</button>
      </div>
      <button type="button" class="btn-text-sm" id="btn-import-cancel" style="align-self:flex-start">Abbrechen</button>
    </div>
    <div class="settings-msg" id="settings-msg" role="status" aria-live="polite"></div>
  </div>

  <button type="button" class="backup-pill" id="backup-pill" hidden>
    <span class="backup-pill-dot"></span>
    <span class="backup-pill-text" id="backup-pill-text"></span>
  </button>

  <button type="button" class="gear-btn" id="gear-btn" aria-label="Einstellungen: Export und Import" aria-expanded="false" aria-controls="settings-panel">
